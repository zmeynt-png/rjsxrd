name: Update VPN Configs

on:
  schedule:
    - cron: "0 0 */2 * *"  # Запуск каждые 2 дня в полночь UTC
  workflow_dispatch:      # Позволяет запускать вручную через кнопку

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: write

    concurrency:
      group: vpn-config-update
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: cd source && pip install --no-cache-dir -r requirements.txt

      - name: Run script with git mode
        id: run_script
        env:
          PROXY_REQUIRED: false
        run: |
          cd source && python main.py --use-git --no-proxy-check

      - name: Check script result
        if: steps.run_script.outcome == 'failure'
        run: |
          echo "::error::VPN config update failed"
          exit 1
